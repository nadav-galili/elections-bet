services:
  db:
    image: postgres:17-alpine
    container_name: elections_bet_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elections_bet
    ports:
      - '5432:5432'
    volumes:
      - elections_bet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d elections_bet']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  elections_bet_pgdata:
